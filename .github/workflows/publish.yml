name: NPM Publish on Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The token must be for the registry in package.json's publishConfig.
      - name: Authenticate with Verdaccio
        run: echo "//upm.wtfgames.com.ua/:_authToken=${VERDACCIO_TOKEN}" >> ~/.npmrc
        env:
          VERDACCIO_TOKEN: ${{ secrets.VERDACCIO_TOKEN }}

      - name: Publish to Verdaccio
        run: npm publish
